spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:banking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:dbuser}
    password: ${DB_PASSWORD:dbpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:banking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    user: ${DB_USERNAME:dbuser}
    password: ${DB_PASSWORD:dbpass}
  h2:
    console:
      enabled: false

server:
  port: 8080
