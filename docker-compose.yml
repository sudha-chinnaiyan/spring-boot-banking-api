
services:
  mysql-db:
    image: mysql:8.0
    container_name: banking_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: banking_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  banking-api:
    build: .
    container_name: banking_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql-db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=dbpass
      - DB_NAME=banking_db
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql-data:
